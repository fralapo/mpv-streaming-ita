# Interfaccia uosc: barra pulita, controlli utili, colori in tinta.

# Barra del tempo a barra piena, sempre visibile in pausa; sottile linea di avanzamento quando l'interfaccia è nascosta
timeline_style=bar
timeline_size=34
timeline_persistency=paused
progress=always
progress_size=3
destination_time=time-remaining

# Barra in alto: titolo dell'episodio e solo il pulsante di chiusura
top_bar=always
top_bar_controls=right
top_bar_title=yes
top_bar_flash_on=video,audio,idle

# Controlli: tracce e capitoli a sinistra, salto OP/ED (compare solo quando serve), velocità, episodi, popup e schermo intero
controls=menu,gap,<video,audio>subtitles,<video>command:hd:script-binding quality/menu?Qualità (Q),<has_many_audio>audio,<has_chapter>chapters,gap,button:skip,space,<video,audio>command:remove:script-binding gestures/speed-down?Più lenta (S),<video,audio>speed,<video,audio>command:add:script-binding gestures/speed-up?Più veloce (D),space,prev,items,next,gap,command:picture_in_picture_alt:run "/home/lapo/.local/bin/mpv-pip-toggle"?Popup in primo piano (P),fullscreen
controls_size=32
controls_spacing=4
controls_persistency=paused

# Volume a destra, scorre con la rotella
volume=right
volume_step=2

# Trascinando il selettore di velocità si va a passi di 0,1 (la rotella la gestisce gestures.lua)
speed_step=0.1

# Proporzioni e ritmo dell'interfaccia
scale=1
scale_fullscreen=1.15
font_scale=1
text_border=1.4
border_radius=8
animation_duration=140
proximity_in=60
proximity_out=140
pause_indicator=flash
menu_item_height=38
menu_min_width=280

# Segmenti OP/ED/recap evidenziati sulla barra del tempo (colore RRGGBBAA)
chapter_ranges=openings:cba6f770,endings:cba6f770,intros:89b4fa60,outros:89b4fa60
chapter_range_patterns=openings:オープニング;endings:エンディング;intros:^recap$

# Palette: viola chiaro come accento, sfondo scuro tendente al blu
color=foreground=cba6f7,foreground_text=11111b,background=181825,background_text=cdd6f4,curtain=11111b,success=a6e3a1,error=f38ba8,match=89dceb,heatmap=cba6f7

# Lingue preferite quando si caricano sottotitoli dal menu
languages=it,ja,en
