# Interfaccia uosc: barra pulita, controlli utili, colori in tinta.

# Barra del tempo a barra piena, sempre visibile in pausa; sottile linea di avanzamento quando l'interfaccia è nascosta
timeline_style=bar
timeline_size=34
timeline_persistency=paused
progress=always
progress_size=3
destination_time=time-remaining

# Barra in alto: titolo dell'episodio e solo il pulsante di chiusura
top_bar=always
top_bar_controls=right
top_bar_title=yes
top_bar_flash_on=video,audio,idle

# Controlli. A schermo intero: tracce, qualità, salto OP/ED (solo quando serve), velocità, episodi, popup.
# Nel popup (user-data/pip, impostato da gestures.lua): sottotitoli, salto, -10 s, pausa, +10 s, torna grande.
controls=<!user-data/pip>menu,<!user-data/pip>gap,<video,audio>subtitles,<video+!user-data/pip>command:hd:script-binding quality/menu?Qualità (Q),<has_many_audio+!user-data/pip>audio,<has_chapter+!user-data/pip>chapters,<!user-data/pip>gap,button:skip,space,<user-data/pip>command:replay_10:seek -10 exact?Indietro 10 s,<user-data/pip>cycle:pause:pause:no/yes=play_arrow?Pausa (clic sul video),<user-data/pip>command:forward_10:seek 10 exact?Avanti 10 s,<video+!user-data/pip>command:remove:script-binding gestures/speed-down?Più lenta (S),<video+!user-data/pip>speed,<video+!user-data/pip>command:add:script-binding gestures/speed-up?Più veloce (D),space,<!user-data/pip>prev,<!user-data/pip>items,<!user-data/pip>next,<!user-data/pip>gap,<!user-data/pip>command:picture_in_picture_alt:run sh -c 'exec "$HOME/.local/bin/mpv-pip-toggle"'?Popup in primo piano (P),<user-data/pip>command:open_in_full:run sh -c 'exec "$HOME/.local/bin/mpv-pip-toggle"'?Torna a schermo intero (P o doppio clic),<!user-data/pip>fullscreen
controls_size=32
controls_spacing=4
controls_persistency=paused

# Volume a destra, scorre con la rotella
volume=right
volume_step=2

# Trascinando il selettore di velocità si va a passi di 0,1 (la rotella la gestisce gestures.lua)
speed_step=0.1

# Proporzioni e ritmo dell'interfaccia
scale=1
scale_fullscreen=1.15
font_scale=1
text_border=1.4
border_radius=8
animation_duration=140
proximity_in=60
proximity_out=140
pause_indicator=flash
menu_item_height=38
menu_min_width=280

# Segmenti OP/ED/recap evidenziati sulla barra del tempo (colore RRGGBBAA, lo imposta mpv-theme)
chapter_ranges=openings:ffffff50,endings:ffffff50,intros:69c5ff50,outros:69c5ff50
chapter_range_patterns=openings:オープニング;endings:エンディング;intros:^recap$

# Colori del tema standard (bianco su nero). Per cambiarli: mpv-theme <nome>, elenco in themes/
color=foreground=ffffff,foreground_text=000000,background=000000,background_text=ffffff,curtain=000000,success=a5e075,error=ff616e,match=69c5ff,heatmap=ffffff

# Lingue preferite quando si caricano sottotitoli dal menu
languages=it,ja,en
