# Velocità mentre tieni premuto → o il clic sul video
boost=2
# Millisecondi prima che la pressione diventi "tenuta"
hold_ms=350
# Pixel di movimento oltre i quali il clic diventa trascinamento della finestra
drag_px=8
# Quante aperture mostrano il suggerimento sui gesti (0 = mai)
hints=3
# Secondi di pausa tra eventi della rotella/touchpad che chiudono un gesto (un gesto = un solo scatto)
wheel_gap=0.3
# Passo di velocità per tasti, pulsanti e rotella
speed_step=0.1
# Con la rotella sul selettore: al massimo uno scatto ogni N secondi mentre scorri
wheel_rate=0.12
