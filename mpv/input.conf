# Scorciatoie e menu contestuale (tasto destro o Invio). Le righe con "#!" costruiscono il menu di uosc.
# Premi ? per l'elenco completo delle scorciatoie con ricerca.

# --- Riproduzione ---
SPACE       cycle pause                                          #! Riproduzione > Pausa / Riprendi
LEFT        seek -5 exact ; script-binding uosc/flash-timeline   #! Riproduzione > Indietro di 5 secondi
RIGHT       script-binding gestures/right                        #! Riproduzione > Avanti di 5 secondi (tieni premuto: 2×)
Shift+LEFT  seek -30 exact ; script-binding uosc/flash-timeline  #! Riproduzione > Indietro di 30 secondi
Shift+RIGHT seek 30 exact ; script-binding uosc/flash-timeline   #! Riproduzione > Avanti di 30 secondi
S           seek 85 exact ; script-binding uosc/flash-timeline   #! Riproduzione > Salta 85 secondi (opening senza capitoli)
0           seek 0 absolute-percent+exact ; script-binding uosc/flash-timeline   #! Riproduzione > Torna all'inizio
1           seek 10 absolute-percent+exact ; script-binding uosc/flash-timeline
2           seek 20 absolute-percent+exact ; script-binding uosc/flash-timeline
3           seek 30 absolute-percent+exact ; script-binding uosc/flash-timeline
4           seek 40 absolute-percent+exact ; script-binding uosc/flash-timeline
5           seek 50 absolute-percent+exact ; script-binding uosc/flash-timeline
6           seek 60 absolute-percent+exact ; script-binding uosc/flash-timeline
7           seek 70 absolute-percent+exact ; script-binding uosc/flash-timeline
8           seek 80 absolute-percent+exact ; script-binding uosc/flash-timeline
9           seek 90 absolute-percent+exact ; script-binding uosc/flash-timeline
.           frame-step                                           #! Riproduzione > Fotogramma avanti
,           frame-back-step                                      #! Riproduzione > Fotogramma indietro
>           playlist-next                                        #! Riproduzione > Episodio successivo
<           playlist-prev                                        #! Riproduzione > Episodio precedente
l           ab-loop                                              #! Riproduzione > Ripeti un tratto (A-B)
TAB         script-binding skip_chapters/skip-chapter            #! Riproduzione > Salta opening / ending
A           script-binding skip_chapters/toggle-auto             #! Riproduzione > Salto automatico on/off

# --- Velocità: passi di 0,1 (da 0,1× a 4×) ---
d           script-binding gestures/speed-up                     #! Velocità > Più veloce
s           script-binding gestures/speed-down                   #! Velocità > Più lenta
r           script-binding gestures/speed-reset                  #! Velocità > Normale (1×)
]           script-binding gestures/speed-up
[           script-binding gestures/speed-down
\           script-binding gestures/speed-reset
BS          script-binding gestures/speed-reset
+           script-binding gestures/speed-up
=           script-binding gestures/speed-up
-           script-binding gestures/speed-down
#           set speed 1.25 ; script-binding uosc/flash-speed     #! Velocità > 1,25×
#           set speed 1.5 ; script-binding uosc/flash-speed      #! Velocità > 1,5×
#           set speed 2 ; script-binding uosc/flash-speed        #! Velocità > 2×

# --- Mouse sul video ---
MBTN_LEFT     script-binding gestures/click
MBTN_LEFT_DBL script-binding gestures/double-click
MBTN_MID      cycle mute
MBTN_BACK     seek -10 exact ; script-binding uosc/flash-timeline
MBTN_FORWARD  seek 10 exact ; script-binding uosc/flash-timeline
WHEEL_UP      add volume 2 ; script-binding uosc/flash-volume
WHEEL_DOWN    add volume -2 ; script-binding uosc/flash-volume
WHEEL_LEFT    script-binding gestures/seek-wheel-back
WHEEL_RIGHT   script-binding gestures/seek-wheel-forward
Shift+WHEEL_UP   seek 10 ; script-binding uosc/flash-timeline
Shift+WHEEL_DOWN seek -10 ; script-binding uosc/flash-timeline

# --- Volume ---
UP          add volume 5 ; script-binding uosc/flash-volume
DOWN        add volume -5 ; script-binding uosc/flash-volume
m           cycle mute                                           #! Audio > Muto
n           af toggle "lavfi=[dynaudnorm=f=150:g=15]" ; show-text "Volume uniforme (dialoghi vs scene forti): ${?af==:disattivato}${!af==:attivo}"   #! Audio > Volume uniforme on/off
Z           add audio-delay -0.1                                 #! Audio > Anticipa audio di 0,1 s
X           add audio-delay 0.1                                  #! Audio > Ritarda audio di 0,1 s

# --- Sottotitoli ---
v           cycle sub-visibility                                 #! Sottotitoli > Mostra / nascondi
j           cycle sub                                            #! Sottotitoli > Traccia successiva
J           cycle sub down                                       #! Sottotitoli > Traccia precedente
Ctrl+LEFT   sub-seek -1                                          #! Sottotitoli > Riga precedente (riascolta)
Ctrl+RIGHT  sub-seek 1                                           #! Sottotitoli > Riga successiva
z           add sub-delay -0.1                                   #! Sottotitoli > Anticipa di 0,1 s
x           add sub-delay 0.1                                    #! Sottotitoli > Ritarda di 0,1 s
R           add sub-pos -1                                       #! Sottotitoli > Sposta più in alto
T           add sub-pos 1                                        #! Sottotitoli > Sposta più in basso

# --- Immagine ---
Ctrl+a      change-list glsl-shaders toggle "~~/shaders/ArtCNN_C4F16.glsl" ; show-text "Upscaling ArtCNN: ${?glsl-shaders==:disattivato}${!glsl-shaders==:attivo}"   #! Immagine > Upscaling ArtCNN on/off
Ctrl+d      cycle deband ; show-text "Deband: ${deband}"         #! Immagine > Elimina banding on/off
Ctrl+i      cycle interpolation ; show-text "Interpolazione: ${interpolation}"   #! Immagine > Interpolazione fluida on/off
#           set video-aspect-override no                         #! Immagine > Proporzioni > Originali
#           set video-aspect-override "16:9"                     #! Immagine > Proporzioni > 16:9
#           set video-aspect-override "4:3"                      #! Immagine > Proporzioni > 4:3
#           set video-aspect-override "2.35:1"                   #! Immagine > Proporzioni > 2.35:1

# --- Finestra ---
f           cycle fullscreen                                     #! Finestra > Schermo intero
p           run sh -c 'exec "$HOME/.local/bin/mpv-pip-toggle"'           #! Finestra > Popup in primo piano on/off

# --- Navigazione e strumenti ---
#           script-binding uosc/subtitles                        #! Tracce > Sottotitoli
#           script-binding uosc/audio                            #! Tracce > Audio
#           script-binding uosc/chapters                         #! Tracce > Capitoli
#           script-binding uosc/items                            #! Episodi e playlist
Ctrl+s      async screenshot                                     #! Strumenti > Screenshot con sottotitoli
Ctrl+S      async screenshot video                               #! Strumenti > Screenshot senza sottotitoli
#           run sh -c 'xdg-open "$HOME/Pictures/mpv"'                 #! Strumenti > Apri la cartella degli screenshot
Q           script-binding quality/menu                          #! Qualità video (automatica o a scelta)
i           script-binding stats/display-stats-toggle            #! Strumenti > Statistiche tecniche
?           script-binding uosc/keybinds                         #! Strumenti > Tutte le scorciatoie
F1          script-binding uosc/keybinds
#           script-binding uosc/audio-device                     #! Strumenti > Uscita audio
q           quit                                                 #! Chiudi
MBTN_RIGHT  script-binding uosc/menu
ENTER       script-binding uosc/menu
menu        script-binding uosc/menu
