# Salto rapido di un'opening (circa 85s)
S seek 85
# Velocità
[ add speed -0.1
] add speed 0.1
\ set speed 1.0
# Sincronizzazione sottotitoli e audio
z add sub-delay -0.1
x add sub-delay +0.1
Z add audio-delay -0.1
X add audio-delay +0.1
# Screenshot con o senza sottotitoli
s screenshot
Ctrl+s screenshot video
# Cicla tracce
j cycle sub
J cycle sub down
# Shader ArtCNN on/off
Ctrl+a change-list glsl-shaders toggle "~~/shaders/ArtCNN_C4F16.glsl"
# Statistiche
i script-binding stats/display-stats-toggle
# Popup / schermo intero: P alterna tra popup fisso in basso a destra e finestra normale
P run "/home/lapo/.local/bin/mpv-pip-toggle"
# Prossimo/precedente episodio
> playlist-next
< playlist-prev
