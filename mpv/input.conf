# Scorciatoie e menu contestuale (tasto destro o Invio). Le righe con "#!" costruiscono il menu di uosc.
# Premi ? per l'elenco completo delle scorciatoie con ricerca.

# --- Riproduzione ---
SPACE       cycle pause                                          #! Riproduzione > Pausa / Riprendi
LEFT        seek -5 exact                                        #! Riproduzione > Indietro di 5 secondi
RIGHT       seek 5 exact                                         #! Riproduzione > Avanti di 5 secondi
Shift+LEFT  seek -30 exact                                       #! Riproduzione > Indietro di 30 secondi
Shift+RIGHT seek 30 exact                                        #! Riproduzione > Avanti di 30 secondi
S           seek 85 exact                                        #! Riproduzione > Salta 85 secondi (opening senza capitoli)
.           frame-step                                           #! Riproduzione > Fotogramma avanti
,           frame-back-step                                      #! Riproduzione > Fotogramma indietro
[           add speed -0.1                                       #! Riproduzione > Velocità più lenta
]           add speed 0.1                                        #! Riproduzione > Velocità più veloce
\           set speed 1.0                                        #! Riproduzione > Velocità normale
>           playlist-next                                        #! Riproduzione > Episodio successivo
<           playlist-prev                                        #! Riproduzione > Episodio precedente
l           ab-loop                                              #! Riproduzione > Ripeti un tratto (A-B)
MBTN_BACK   seek -10 exact
MBTN_FORWARD seek 10 exact
TAB         script-binding skip_chapters/skip-chapter            #! Riproduzione > Salta opening / ending
A           script-binding skip_chapters/toggle-auto             #! Riproduzione > Salto automatico on/off

# --- Volume (UP/DOWN e rotella) ---
UP          add volume 5
DOWN        add volume -5
m           cycle mute                                           #! Audio > Muto
n           af toggle "lavfi=[dynaudnorm=f=150:g=15]" ; show-text "Volume uniforme (dialoghi vs scene forti): ${?af==:disattivato}${!af==:attivo}"   #! Audio > Volume uniforme on/off
Z           add audio-delay -0.1                                 #! Audio > Anticipa audio di 0,1 s
X           add audio-delay 0.1                                  #! Audio > Ritarda audio di 0,1 s

# --- Sottotitoli ---
v           cycle sub-visibility                                 #! Sottotitoli > Mostra / nascondi
j           cycle sub                                            #! Sottotitoli > Traccia successiva
J           cycle sub down                                       #! Sottotitoli > Traccia precedente
Ctrl+LEFT   sub-seek -1                                          #! Sottotitoli > Riga precedente (riascolta)
Ctrl+RIGHT  sub-seek 1                                           #! Sottotitoli > Riga successiva
z           add sub-delay -0.1                                   #! Sottotitoli > Anticipa di 0,1 s
x           add sub-delay 0.1                                    #! Sottotitoli > Ritarda di 0,1 s
r           add sub-pos -1
t           add sub-pos 1

# --- Immagine ---
Ctrl+a      change-list glsl-shaders toggle "~~/shaders/ArtCNN_C4F16.glsl" ; show-text "Upscaling ArtCNN: ${?glsl-shaders==:disattivato}${!glsl-shaders==:attivo}"   #! Immagine > Upscaling ArtCNN on/off
d           cycle deband ; show-text "Deband: ${deband}"         #! Immagine > Elimina banding on/off
Ctrl+i      cycle interpolation ; show-text "Interpolazione: ${interpolation}"   #! Immagine > Interpolazione fluida on/off
#           set video-aspect-override no                         #! Immagine > Proporzioni > Originali
#           set video-aspect-override "16:9"                     #! Immagine > Proporzioni > 16:9
#           set video-aspect-override "4:3"                      #! Immagine > Proporzioni > 4:3
#           set video-aspect-override "2.35:1"                   #! Immagine > Proporzioni > 2.35:1

# --- Finestra ---
f           cycle fullscreen                                     #! Finestra > Schermo intero
p           run "/home/lapo/.local/bin/mpv-pip-toggle"           #! Finestra > Popup in primo piano on/off
MBTN_LEFT_DBL run "/home/lapo/.local/bin/mpv-pip-toggle"

# --- Navigazione e strumenti ---
#           script-binding uosc/subtitles                        #! Tracce > Sottotitoli
#           script-binding uosc/audio                            #! Tracce > Audio
#           script-binding uosc/chapters                         #! Tracce > Capitoli
#           script-binding uosc/items                            #! Episodi e playlist
s           async screenshot                                     #! Strumenti > Screenshot con sottotitoli
Ctrl+s      async screenshot video                               #! Strumenti > Screenshot senza sottotitoli
i           script-binding stats/display-stats-toggle            #! Strumenti > Statistiche tecniche
?           script-binding uosc/keybinds                         #! Strumenti > Tutte le scorciatoie
F1          script-binding uosc/keybinds
#           script-binding uosc/audio-device                     #! Strumenti > Uscita audio
q           quit                                                 #! Chiudi
MBTN_RIGHT  script-binding uosc/menu
ENTER       script-binding uosc/menu
menu        script-binding uosc/menu
