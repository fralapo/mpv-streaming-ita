# mpv per anime/serie/film, ottimizzato per Intel Arc B390 (Panther Lake) su Wayland, schermo 3120x2080@120Hz

# --- Video: libplacebo su Vulkan, decodifica hardware VA-API ---
profile=high-quality
vo=gpu-next
gpu-api=vulkan
gpu-context=waylandvk
hwdec=vaapi,auto-safe

scale=ewa_lanczos
dscale=catmull_rom
cscale=ewa_lanczossharp
deband=yes
deband-iterations=2
deband-threshold=35
deband-range=16
deband-grain=8

# Fluidità: si sincronizza sull'audio. Con display-resample su Wayland mpv stimava 60-67Hz invece di 120 e saltava fotogrammi
video-sync=audio
interpolation=no

# --- Interfaccia (uosc sostituisce l'OSC predefinito) ---
osc=no
osd-bar=no
border=no
osd-font='Noto Sans'
osd-font-size=34
osd-border-size=2
osd-duration=2000
# La finestra compare subito: durante il caricamento (e la prima compilazione dello shader) si vede che sta partendo
force-window=immediate
background-color='#11111b'
fullscreen=yes
keep-open=yes
cursor-autohide=1000
cursor-autohide-fs-only=no
# Il riscontro dei salti lo dà la barra di uosc che lampeggia
osd-on-seek=no

# --- Lingue: audio giapponese, sottotitoli italiani ---
alang=ja,jpn,it,ita,en,eng
slang=it,ita,en,eng
sub-auto=fuzzy
sub-file-paths=sub:subs:Subs
sub-font='Noto Sans'
sub-font-size=46
sub-border-size=2.4
sub-shadow-offset=1
blend-subtitles=video

# --- Audio ---
volume=100
volume-max=130
audio-channels=stereo
audio-pitch-correction=yes

# --- Rete e cache (stream HLS/MP4 remoti) ---
cache=yes
demuxer-max-bytes=400MiB
demuxer-max-back-bytes=100MiB
demuxer-readahead-secs=90
network-timeout=20
# Ogni versione HLS diventa una traccia video: quality.lua sceglie e cambia qualità mentre guardi
hls-bitrate=no

# --- Screenshot ---
screenshot-format=webp
screenshot-webp-lossless=yes
screenshot-dir=~/Pictures/mpv
screenshot-template="%F-%wH.%wM.%wS"

# --- Riprendi da dove eri rimasto ---
save-position-on-quit=yes
watch-later-options=start,volume,sub-delay,audio-delay,sid,aid

# --- Anime: ArtCNN è addestrato sull'animazione, su film e serie dal vivo pesa e non migliora nulla ---
# Lo attiva il server MCP di aw-cli con --profile=anime (Ctrl+a lo accende o spegne a mano)
[anime]
glsl-shaders="~~/shaders/ArtCNN_C4F16.glsl"

# --- Popup: finestra piccola in basso a destra, gestita dalle regole Hyprland (AnimePip) ---
[pip]
fullscreen=no
wayland-app-id=AnimePip
title=${?media-title:${media-title}}${!media-title:No file}
keepaspect-window=yes
osd-font-size=24
cursor-autohide=1500
# Interfaccia più compatta nella finestra piccola
script-opts-append=uosc-scale=0.8,uosc-timeline_size=28,uosc-top_bar_size=34,uosc-progress_size=2
